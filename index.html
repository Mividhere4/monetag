<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch & Discover</title>
<meta name="description" content="Watch and discover more.">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#08080c;
  color:#fff;
}

.card{
  width:min(94%,560px);
  padding:22px;
  text-align:center;
  background:#15151d;
  border:1px solid #2b2b38;
  border-radius:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);
}

.badge{
  font-size:12px;
  letter-spacing:2px;
  opacity:.65;
  margin-bottom:14px;
}

h1{
  font-size:28px;
  margin:8px 0;
}

p{
  color:#b9b9c4;
  line-height:1.5;
  margin:8px 0 20px;
}

/* VIDEO */
.video{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:16px;
  background:
    radial-gradient(circle at 50% 45%, #3b3b48 0%, #20202a 28%, #0d0d13 70%);
  border:1px solid #30303c;
  cursor:pointer;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.video:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.08),
      transparent 40%,
      rgba(255,255,255,.03)
    );
}

.video-title{
  position:absolute;
  top:14px;
  left:14px;
  font-size:12px;
  padding:7px 10px;
  border-radius:6px;
  background:rgba(0,0,0,.55);
  color:#fff;
}

.play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:82px;
  height:82px;
  border-radius:50%;
  border:0;
  background:#fff;
  color:#111;
  font-size:34px;
  padding-left:6px;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
  transition:.2s;
}

.video:hover .play{
  transform:translate(-50%,-50%) scale(1.08);
}

.play-text{
  position:absolute;
  left:0;
  right:0;
  bottom:42px;
  font-size:14px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

.controls{
  position:absolute;
  left:14px;
  right:14px;
  bottom:14px;
}

.progress{
  height:4px;
  width:100%;
  background:rgba(255,255,255,.25);
  border-radius:10px;
  overflow:hidden;
}

.progress span{
  display:block;
  width:28%;
  height:100%;
  background:#fff;
  border-radius:10px;
}

.control-row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:11px;
  color:#ddd;
}

.continue{
  display:block;
  width:100%;
  margin-top:18px;
  padding:15px 20px;
  border-radius:12px;
  background:#fff;
  color:#111;
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
}

.timer{
  font-size:14px;
  color:#8f8f9c;
  margin-top:14px;
}
</style>
</head>

<body>

<div class="card">

  <div class="badge">WATCH & DISCOVER</div>

  <h1>Ready to watch?</h1>

  <p>Tap the play button to continue.</p>

  <div class="video" id="videoBox">

    <div class="video-title">▶ PREVIEW</div>

    <button class="play" id="playBtn" aria-label="Play">
      ▶
    </button>

    <div class="play-text">
      TAP TO PLAY
    </div>

    <div class="controls">
      <div class="progress">
        <span></span>
      </div>

      <div class="control-row">
        <span>▶</span>
        <span>0:28 / 1:42</span>
        <span>⛶</span>
      </div>
    </div>

  </div>

  <a
    class="continue"
    id="continueBtn"
    href="https://omg10.com/4/11937256"
    rel="nofollow noopener">
    CONTINUE
  </a>

  <div class="timer" id="timer">
    Redirecting in 10 seconds
  </div>

</div>

<script>
const directLink = "https://omg10.com/4/11937256";

// Play
document.getElementById("playBtn").addEventListener("click", () => {
  window.location.href = directLink;
});

// También permite hacer clic en toda la ventana del video
document.getElementById("videoBox").addEventListener("click", () => {
  window.location.href = directLink;
});

// Redirección automática
let seconds = 10;
const timer = document.getElementById("timer");

const countdown = setInterval(() => {

  seconds--;

  if(seconds > 0){
    timer.textContent = `Redirecting in ${seconds} seconds`;
  }else{
    clearInterval(countdown);
    timer.textContent = "Redirecting...";
    window.location.href = directLink;
  }

},1000);
</script>

</body>
</html>
